# Expanded Production Configuration for AI Security Orchestrator CLI

openrouter:
  api_key: "YOUR_OPENROUTER_API_KEY_HERE"
  base_url: "https://openrouter.ai/api/v1"
  default_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  fallback_model: "google/gemini-2.0-flash-exp:free"
  timeout_seconds: 45.0
  temperature: 0.7
  max_tokens: 2048
  site_url: "https://github.com/security-ai-orchestrator"
  app_name: "AI Security Orchestrator CLI"

executor:
  default_timeout_seconds: 60.0
  max_timeout_seconds: 600.0
  allow_environment_pass_through: false
  safe_environment_vars:
    - PATH
    - SYSTEMROOT
    - TEMP
    - TMP
    - HOME
    - USER
    - LANG

database:
  db_url: "sqlite:///security_orchestrator.db"
  echo: false

reports:
  output_dir: "reports_output"
  default_formats:
    - md
    - html
    - pdf

plugins:
  plugins_dir: "plugins"
  enabled_plugins:
    - nmap
    - whatweb
    - nikto
    - gobuster
    - nuclei

timeouts:
  nmap:
    fast: 120
    standard: 600
    deep: 1800
  whatweb:
    fast: 60
    standard: 300
    deep: 900
  nikto:
    fast: 180
    standard: 900
    deep: 2400
  gobuster:
    fast: 180
    standard: 1200
    deep: 3600
  nuclei:
    fast: 300
    standard: 1800
    deep: 7200

logging:
  level: "INFO"
  json_format: false
  log_file: null
