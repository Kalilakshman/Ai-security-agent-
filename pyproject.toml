[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-orchestrator"
version = "0.1.0"
description = "Production-grade AI Security Orchestrator CLI for authorized penetration testing and security assessment workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "AI DevSecOps Team" }
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.28",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.scripts]
security-ai = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "plugins", "memory", "reports"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "C4", "T20", "Q", "SIM"]
