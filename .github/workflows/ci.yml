name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Lint, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap tshark

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .

      - name: Run MyPy Type Checking
        run: |
          mypy app/ core/ plugins/ memory/ reports/

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest --cov=core --cov=app --cov=plugins --cov-report=term-missing tests/

      - name: Run Security Vulnerability & Secret Scanning
        run: |
          pip install bandit safety
          bandit -r core/ app/ plugins/ -s B101,B108 || true
          safety check || true
